name: CI
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Build
        run: npm run build
      - id: assign-reviewers
        name: Assign reviewers to dependency changes
        continue-on-error: true
        uses: ./
        with:
          dependency-file: 'package.json'
          loader: '@dependency-owners/package-json-loader'
      - name: Test action
        run: |
          if [[ ! $(echo '${{ steps.assign-reviewers.outputs.reviewers }}' | jq 'length') -ge 0 ]]; then
            exit 1
          fi
      - name: Check dist for changes
        run: git diff --exit-code --quiet ./dist
